<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts are self-hosted (see scripts/fetchFonts.mjs). The two
         render-blocking Google Fonts stylesheets that used to live here
         are gone, along with their preconnects: nothing on the critical
         path resolves off-origin any more.

         Only the two faces the first screen actually paints in are
         preloaded. Preloading is a priority claim, not a free win —
         every extra preload competes with the JS bundle for bandwidth,
         so the latin-ext and Gujarati faces are deliberately left to be
         discovered from CSS:
           - Inter 400..800  : all body copy
           - Poppins 700     : the Home <h1>, which is the LCP element
         crossorigin is required even same-origin; fonts are always
         fetched in CORS mode and the preload must match or it's
         downloaded twice. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400-800var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Jumpstride</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
