server {
    server_name jumpstartedu.com www.jumpstartedu.com jumpstride.in www.jumpstride.in;

    root /var/www/jumpstart-current/frontend/dist;
    index index.html;

    include snippets/jumpstart-security-headers.conf;
    include snippets/jumpstart-static.conf;

    # Serve frontend, fall back to index.html for client-side routing.
    # Pages on the other hostnames redirect to the canonical domain; /api and
    # static files stay served on every host so webhooks and open tabs work.
    location / {
        if ($host != "jumpstride.in") {
            return 301 https://jumpstride.in$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
    }

    # Gzip (Nginx serves the pre-compressed .gz files the build made)
    gzip_static on;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jumpstartedu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jumpstartedu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot






}
server {
    if ($host = www.jumpstride.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = jumpstride.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.jumpstartedu.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = jumpstartedu.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name jumpstartedu.com www.jumpstartedu.com jumpstride.in www.jumpstride.in;
    return 404; # managed by Certbot








}
