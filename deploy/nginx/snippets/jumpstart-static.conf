# Static-file rules for the Vite build. Hashed files never change, so cache
# them for a year; a missing one must 404 (not fall back to index.html), or a
# tab opened before a deploy loads HTML as JavaScript and goes blank.
location /assets/ {
    try_files $uri =404;
    include snippets/jumpstart-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location /fonts/ {
    try_files $uri =404;
    include snippets/jumpstart-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}
location /question-media/ {
    try_files $uri =404;
    include snippets/jumpstart-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}
# The SPA shell must always be revalidated so a new deploy is picked up.
location = /index.html {
    include snippets/jumpstart-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
